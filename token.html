<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>XUHAO - Cấp Mã Token</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; text-align: center; padding-top: 50px; margin: 0; }
    .card { background: #16213e; max-width: 400px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 0 15px #0f3460; }
    input { padding: 12px; width: 85%; margin: 10px 0; border-radius: 6px; border: none; text-align: center; font-size: 15px; background: #0f3460; color: #fff; }
    button { padding: 12px 24px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; width: 90%; margin-top: 10px; }
    button:hover { opacity: 0.9; }
    .token-box { background: #0f3460; padding: 15px; margin-top: 15px; border-radius: 8px; font-size: 20px; color: #4eefc5; word-break: break-all; font-weight: bold; }
    .btn-go { background: #00b4d8; display: block; text-decoration: none; color: white; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; }
  </style>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="card">
    <h2>🔑 HỆ THỐNG CẤP TOKEN XUHAO</h2>
    <p>Nhập tên của ông để tạo Token nghe nhạc:</p>
    <input type="text" id="username" placeholder="Nhập tên của ông...">
    <br>
    <button id="btnTao" onclick="taoToken()">✨ Tạo Mã Token</button>

    <div id="result" style="display:none;">
      <p style="margin-top: 15px; color: #aaa;">Mã Token bí mật của ông là:</p>
      <div class="token-box" id="tokenDisplay"></div>
      <p><small style="color: #4eefc5;">✅ Đã lưu Token thành công lên máy chủ Firebase!</small></p>
      
      <!-- Nút chuyển về lại index.html -->
      <a href="index.html" class="btn-go">🚀 Quay Lại Trang Nghe Nhạc</a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      measurementId: "G-KYSTJFD03T"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function taoToken() {
      let name = document.getElementById('username').value.trim();
      if(!name) { alert("Ông chưa nhập tên kìa!"); return; }

      let btn = document.getElementById('btnTao');
      btn.innerText = "⏳ Đang kết nối Firebase...";
      btn.disabled = true;

      let randomNum = Math.floor(1000 + Math.random() * 9000);
      let cleanName = name.replace(/\s+/g, '').toUpperCase();
      let token = "XUHAO-" + cleanName + "-" + randomNum;

      try {
        await db.collection("tokens").doc(token).set({
          username: name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('tokenDisplay').innerText = token;
        document.getElementById('result').style.display = "block";
        btn.innerText = "✨ Tạo Mã Token Mới";
        btn.disabled = false;
      } catch(err) {
        alert("Lỗi lưu Token: " + err.message);
        btn.innerText = "✨ Tạo Mã Token";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
