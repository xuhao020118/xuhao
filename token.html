<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Token Truy Cập</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 { color: #a855f7; margin-top: 0; }
    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
      text-align: center;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .token-preview {
      color: #38bdf8;
      font-weight: bold;
      margin-top: 15px;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🔐 TẠO TOKEN TRUY CẬP</h2>
  <p style="color: #94a3b8; font-size: 13px;">Nhập tên của bạn vào để tạo token:<br><b style="color: #38bdf8;">xuhao-[Tên]-[MãSố]</b></p>
  
  <input type="text" id="username" placeholder="Nhập tên của bạn...">
  
  <button id="btn-create">🔑 TẠO TOKEN</button>
  
  <div id="token-result" class="token-preview"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5W9wtr6khkvZLkDQpDaPkDq1bUZgXgMw",
    authDomain: "nhaccuahongdang.firebaseapp.com",
    projectId: "nhaccuahongdang",
    storageBucket: "nhaccuahongdang.firebasestorage.app",
    messagingSenderId: "713163379824",
    appId: "1:713163379824:web:edea7ed0847d99932b10b5",
    measurementId: "G-KY5TJFD03T"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById('btn-create').addEventListener('click', async function() {
    const nameInput = document.getElementById('username').value.trim();
    
    if (!nameInput) {
      alert("Vui lòng nhập tên của bạn!");
      return;
    }

    const btn = document.getElementById('btn-create');
    btn.innerText = "⏳ Đang tạo Token...";
    btn.disabled = true;

    const cleanName = nameInput.replace(/\s+/g, '');
    const secretNum = Math.floor(100000 + Math.random() * 900000);
    const token = `xuhao-${cleanName}-${secretNum}`;

    try {
      await addDoc(collection(db, "tokens"), {
        token_key: token,
        created_by: cleanName,
        created_at: new Date().toISOString()
      });

      localStorage.setItem('xuhao_access_token', token);
      
      document.getElementById('token-result').innerText = "✅ Đã tạo Token: " + token;

      setTimeout(() => {
        window.location.href = "index.html";
      }, 600);

    } catch (err) {
      alert("Lỗi kết nối Firebase: " + err.message);
      btn.innerText = "🔑 TẠO TOKEN";
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
