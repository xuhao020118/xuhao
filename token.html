<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>XUHAO - Cấp Mã Token</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; text-align: center; padding-top: 50px; }
        .card { background: #16213e; max-width: 400px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 0 15px #0f3460; }
        input { padding: 10px; width: 80%; margin: 10px 0; border-radius: 5px; border: none; text-align: center; }
        button { padding: 10px 20px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .token-box { background: #0f3460; padding: 15px; margin-top: 15px; border-radius: 8px; font-size: 20px; color: #4eefc5; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔑 HỆ THỐNG CẤP TOKEN XUHAO</h2>
        <p>Nhập tên của ông để tạo Token nghe nhạc:</p>
        <input type="text" id="username" placeholder="Nhập tên của ông...">
        <br>
        <button onclick="taoToken()">Tạo Mã Token</button>

        <div id="result" style="display:none;">
            <p>Mã Token bí mật của ông là:</p>
            <div class="token-box" id="tokenDisplay"></div>
            <p><small>Hãy copy mã này và nhập vào Trang Nghe Nhạc nhé!</small></p>
        </div>
    </div>

    <script>
        function taoToken() {
            let name = document.getElementById('username').value;
            if(!name) { alert("Ông chưa nhập tên kìa!"); return; }
            
            // Tạo mã ngẫu nhiên dạng: XUHAO-NgoaiDoi-1234
            let randomNum = Math.floor(1000 + Math.random() * 9000);
            let token = "XUHAO-" + name.toUpperCase() + "-" + randomNum;

            document.getElementById('tokenDisplay').innerText = token;
            document.getElementById('result').style.display = "block";
        }
    </script>
</body>
</html>
