<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XUHAO - Web Nghe Nhạc Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; text-align: center; padding-top: 40px; }
        .box { background: #1e293b; max-width: 450px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 0 20px #38bdf8; }
        input { padding: 12px; width: 80%; margin: 15px 0; border-radius: 8px; border: none; text-align: center; font-size: 16px; }
        .btn-main { padding: 12px 25px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-bottom: 15px; }
        .btn-token { display: inline-block; padding: 10px 20px; background: #e94560; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        #player { display: none; margin-top: 20px; }
    </style>

    <!-- Kết nối thư viện Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Màn hình khóa Token -->
    <div class="box" id="lockScreen">
        <h2>🔒 KHÓA BẢO MẬT XUHAO</h2>
        <p>Vui lòng nhập mã Token để mở khóa trình phát nhạc:</p>
        <input type="text" id="tokenInput" placeholder="Ví dụ: XUHAO-NAM-1234">
        <br>
        <button class="btn-main" onclick="xacNhanToken()">Mở Khóa Nghe Nhạc</button>
        <hr style="border: 0.5px solid #334155; margin: 20px 0;">
        <p>Chưa có mã Token?</p>
        <a href="token.html" class="btn-token">🔑 Bấm vào đây để Lấy Mã Token</a>
    </div>

    <!-- Màn hình phát nhạc từ Firebase -->
    <div class="box" id="player">
        <h2>🎉 KẾT NỐI MÁY CHỦ THÀNH CÔNG!</h2>
        <p id="songTitle">Đang lấy dữ liệu bài hát từ Firebase...</p>
        
        <audio controls id="myAudio" style="width: 100%; margin-top: 15px;">
            Trình duyệt không hỗ trợ phát nhạc!
        </audio>
    </div>

    <script>
        // Cấu hình Firebase API của ông
        const firebaseConfig = {
          apiKey: "AIzaSyD5W9wtr6khkvZLkDQpDaPkDq1bUZgXgMw",
          authDomain: "nhaccuahongdang.firebaseapp.com",
          projectId: "nhaccuahongdang",
          storageBucket: "nhaccuahongdang.firebasestorage.app",
          messagingSenderId: "713163379824",
          appId: "1:713163379824:web:edea7ed0847d99932b10b5",
          measurementId: "G-KY5TJFD03T"
        };

        // Khởi tạo Firebase Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function xacNhanToken() {
            let input = document.getElementById('tokenInput').value.trim();
            
            if (input.startsWith("XUHAO-")) {
                alert("Mã Token hợp lệ! Đang kéo nhạc từ máy chủ nhaccuahongdang...");
                document.getElementById('lockScreen').style.display = "none";
                document.getElementById('player').style.display = "block";

                // Tự động kéo link nhạc từ collection playlist trên Firestore của ông
                db.collection("playlist").get().then((querySnapshot) => {
                    querySnapshot.forEach((doc) => {
                        let data = doc.data();
                        if (data.songUrl) {
                            let audio = document.getElementById("myAudio");
                            audio.src = data.songUrl;
                            document.getElementById("songTitle").innerText = "Bài hát: " + (data.songName || "Đang phát từ Firebase");
                            audio.play();
                        }
                    });
                }).catch((error) => {
                    alert("Lỗi kết nối máy chủ: " + error.message);
                });

            } else {
                alert("❌ Mã Token không đúng! Vui lòng bấm nút bên dưới để lấy mã!");
            }
        }
    </script>
</body>
</html>
