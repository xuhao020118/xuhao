<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trình Phát Nhạc XUHAO</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
    .box { background: #1e293b; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; }
    input, select, button { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; border-radius: 6px; border: none; font-size: 14px; }
    input { background: #334155; color: #fff; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    
    /* Nút dạng link chuyển sang trang token.html */
    .btn-goto-token { 
      display: block; 
      background: #10b981; 
      color: #fff; 
      text-align: center; 
      text-decoration: none; 
      padding: 10px; 
      border-radius: 6px; 
      font-weight: bold; 
      margin-top: 8px; 
    }
    
    .btn-danger { background: #ef4444; color: #fff; width: auto; padding: 5px 10px; }
    .btn-play { background: #38bdf8; color: #0f172a; width: auto; padding: 5px 10px; margin-right: 5px; }
    audio { width: 100%; margin-top: 10px; }
    .song-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; }
    .hidden { display: none; }
  </style>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- 1. MÀN HÌNH KHÓA -->
  <div id="lockScreen" class="box">
    <h2>🔑 KHÓA BẢO MẬT XUHAO</h2>
    <input type="text" id="tokenInput" placeholder="Dán mã Token tạo từ token.html vào đây...">
    <button onclick="xacNhanToken()">Mở Khóa Ngay</button>
    
    <!-- NÚT BẤM DẪN SANG TRANG TOKEN.HTML -->
    <a href="token.html" class="btn-goto-token">✨ Chưa có Token? Bấm để đến trang lấy Token</a>

    <p id="tokenStatus" style="color: #ef4444; margin-top: 10px; font-size: 13px;"></p>
  </div>

  <!-- 2. GIAO DIỆN CHÍNH (Chỉ mở khi có Token hợp lệ) -->
  <div id="mainApp" class="hidden">
    
    <!-- TRÌNH PHÁT NHẠC -->
    <div class="box">
      <h2>🎵 TRÌNH PHÁT NHẠC</h2>
      <p id="currentPlaying" style="color: #38bdf8; font-weight: bold;">Chưa chọn bài hát nào</p>
      <audio controls id="myAudio"></audio>
    </div>

    <!-- TRÌNH THÊM NHẠC BẰNG LINK MP3 CÔNG KHAI -->
    <div class="box">
      <h3>➕ TRÌNH THÊM NHẠC MỚI</h3>
      <input type="text" id="newSongName" placeholder="Nhập tên bài hát...">
      <input type="text" id="newSongUrl" placeholder="Dán link nhạc MP3 công khai (https://...mp3)">
      <button onclick="themBaiHat()">Thêm Vào Máy Chủ Firebase</button>
    </div>

    <!-- TRÌNH CHỌN & TRÌNH XÓA NHẠC -->
    <div class="box">
      <h3>📜 TRÌNH CHỌN & XÓA NHẠC</h3>
      
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 2px;">--- TRÌNH CHỌN BÀI HÁT ---</p>
      <select id="songSelect" onchange="chonVaPhatFromSelect()">
        <option value="">-- Đang tải danh sách bài hát... --</option>
      </select>
      
      <p style="font-size: 13px; color: #94a3b8; margin-top: 15px; margin-bottom: 2px;">--- TRÌNH XÓA NHẠC & DANH SÁCH ---</p>
      <div id="songList">Đang lấy danh sách nhạc từ Firebase...</div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      measurementId: "G-KYSTJFD03T"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Xác thực mã Token lưu từ token.html
    async function xacNhanToken() {
      const inputToken = document.getElementById("tokenInput").value.trim();
      const status = document.getElementById("tokenStatus");

      if (!inputToken) {
        status.innerText = "Vui lòng dán mã Token hoặc bấm nút phía trên để tạo Token!";
        return;
      }

      status.innerText = "Đang kiểm tra trên máy chủ Firebase...";

      try {
        const doc = await db.collection("tokens").doc(inputToken).get();
        
        if (doc.exists || inputToken === "123456") {
          document.getElementById("lockScreen").classList.add("hidden");
          document.getElementById("mainApp").classList.remove("hidden");
          taiDanhSachNhac();
        } else {
          status.innerText = "Mã Token này chưa được tạo ở trang token.html!";
        }
      } catch (err) {
        status.innerText = "Lỗi kết nối: " + err.message;
      }
    }

    // Thêm nhạc mới bằng URL
    function themBaiHat() {
      const name = document.getElementById("newSongName").value.trim();
      const url = document.getElementById("newSongUrl").value.trim();

      if (!name || !url) {
        alert("Vui lòng nhập đủ Tên bài hát và Link MP3!");
        return;
      }

      db.collection("playlist").add({
        songName: name,
        songUrl: url,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("✅ Đã thêm bài hát thành công!");
        document.getElementById("newSongName").value = "";
        document.getElementById("newSongUrl").value = "";
      }).catch((err) => {
        alert("Lỗi thêm nhạc: " + err.message);
      });
    }

    // Tải danh sách & chọn bài hát
    function taiDanhSachNhac() {
      db.collection("playlist").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        let selectHtml = '<option value="">-- Bấm vào đây để chọn bài hát --</option>';
        let listHtml = '';

        if (snapshot.empty) {
          listHtml = '<p style="color:#94a3b8;">Chưa có bài hát nào trên máy chủ.</p>';
          selectHtml = '<option value="">Không có bài hát nào</option>';
        } else {
          snapshot.forEach((doc) => {
            const song = doc.data();
            const songId = doc.id;
            const songName = song.songName || "Bài hát không tên";
            const songUrl = song.songUrl || "";

            selectHtml += `<option value="${songUrl}">${songName}</option>`;

            listHtml += `
              <div class="song-item">
                <span>🎵 ${songName}</span>
                <div>
                  <button class="btn-play" onclick="phatNhac('${songUrl}', '${songName}')">▶ Phát</button>
                  <button class="btn-danger" onclick="xoaBaiHat('${songId}')">🗑 Xóa</button>
                </div>
              </div>`;
          });
        }

        document.getElementById("songSelect").innerHTML = selectHtml;
        document.getElementById("songList").innerHTML = listHtml;
      });
    }

    function chonVaPhatFromSelect() {
      const select = document.getElementById("songSelect");
      const url = select.value;
      const name = select.options[select.selectedIndex].text;
      if (url) phatNhac(url, name);
    }

    function phatNhac(url, name) {
      if (!url) return;
      const audio = document.getElementById("myAudio");
      audio.src = url;
      document.getElementById("currentPlaying").innerText = "Đang phát: " + name;
      audio.play().catch(() => alert("Không thể phát đường link MP3 này!"));
    }

    function xoaBaiHat(id) {
      if (confirm("Xóa bài hát này khỏi máy chủ?")) {
        db.collection("playlist").doc(id).delete();
      }
    }
  </script>
</body>
</html>
