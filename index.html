<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Khóa Bảo Mật & Trình Phát Nhạc MP3</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .box { background: #1e293b; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
    input, select, button { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; border-radius: 4px; border: none; }
    input { background: #334155; color: #fff; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    audio { width: 100%; margin-top: 10px; }
    .song-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; }
    .hidden { display: none; }
    .btn-danger { background: #ef4444; color: #fff; width: auto; padding: 5px 10px; }
    .btn-play { background: #38bdf8; color: #0f172a; width: auto; padding: 5px 10px; margin-right: 5px; }
  </style>

  <!-- Thư viện Firebase CDN (Chỉ dùng Firestore, không dùng Storage) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- 1. Màn hình khóa Token -->
  <div id="lockScreen" class="box">
    <h2>🔑 KHÓA BẢO MẬT XUHAO</h2>
    <input type="password" id="tokenInput" placeholder="Nhập mã Token để truy cập...">
    <button onclick="xacNhanToken()">Mở Khóa</button>
    <p id="tokenStatus" style="color: #ef4444; margin-top: 5px;"></p>
  </div>

  <!-- 2. Giao diện chính (Ẩn cho đến khi xác thực Token thành công) -->
  <div id="mainApp" class="hidden">
    
    <!-- Trình phát nhạc -->
    <div class="box">
      <h2>🎵 TRÌNH PHÁT NHẠC</h2>
      <p id="currentPlaying" style="color: #38bdf8; font-weight: bold;">Chưa chọn bài hát nào</p>
      <audio controls id="myAudio"></audio>
    </div>

    <!-- Trình thêm nhạc bằng Link URL MP3 -->
    <div class="box">
      <h3>➕ THÊM NHẠC MỚI (LINK MP3 CÔNG KHAI)</h3>
      <input type="text" id="newSongName" placeholder="Nhập tên bài hát...">
      <input type="text" id="newSongUrl" placeholder="Dán link nhạc (URL / Direct MP3 link)...">
      <button onclick="themBaiHat()">Thêm Vào Máy Chủ Firebase</button>
    </div>

    <!-- Danh sách & Chọn bài hát -->
    <div class="box">
      <h3>📜 DANH SÁCH & TRÌNH CHỌN BÀI HÁT</h3>
      <p style="font-size: 14px; color: #94a3b8;">--- TRÌNH CHỌN BÀI HÁT ---</p>
      <select id="songSelect" onchange="chonVaPhatFromSelect()">
        <option value="">-- Đang tải danh sách bài hát... --</option>
      </select>
      
      <div id="songList" style="margin-top: 15px;">Đang kết nối máy chủ lấy danh sách nhạc...</div>
    </div>

  </div>

  <script>
    // 1. Cấu hình Firebase của bạn
    const firebaseConfig = {
      // Dán thông số firebaseConfig (apiKey, projectId, ...) của bạn vào đây
      measurementId: "G-KYSTJFD03T"
    };

    // Khởi tạo Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. Mã Token bảo mật
    const SECRET_TOKEN = "123456"; // Thay đổi token của bạn ở đây

    function xacNhanToken() {
      const input = document.getElementById("tokenInput").value.trim();
      if (input === SECRET_TOKEN) {
        document.getElementById("lockScreen").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");
        taiDanhSachNhac(); // Tải danh sách bài hát khi xác thực thành công
      } else {
        document.getElementById("tokenStatus").innerText = "Token không chính xác!";
      }
    }

    // 3. Thêm bài hát bằng URL công khai vào Firestore
    function themBaiHat() {
      const name = document.getElementById("newSongName").value.trim();
      const url = document.getElementById("newSongUrl").value.trim();

      if (!name || !url) {
        alert("Vui lòng nhập đủ Tên bài hát và Link nhạc!");
        return;
      }

      db.collection("playlist").add({
        songName: name,
        songUrl: url,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("✅ Đã thêm bài hát thành công!");
        document.getElementById("newSongName").value = "";
        document.getElementById("newSongUrl").value = "";
      }).catch((err) => {
        alert("Lỗi khi thêm nhạc: " + err.message);
      });
    }

    // 4. Tự động đồng bộ danh sách nhạc từ Firestore
    function taiDanhSachNhac() {
      db.collection("playlist").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        let selectHtml = '<option value="">-- Bấm vào đây để chọn bài hát --</option>';
        let listHtml = '';

        if (snapshot.empty) {
          listHtml = '<p>Chưa có bài hát nào trên máy chủ.</p>';
          selectHtml = '<option value="">Không có bài hát nào</option>';
        } else {
          snapshot.forEach((doc) => {
            const song = doc.data();
            const songId = doc.id;
            const songName = song.songName || "Bài hát không tên";
            const songUrl = song.songUrl || "";

            // Đưa vào Trình chọn (Select Option)
            selectHtml += `<option value="${songUrl}">${songName}</option>`;

            // Đưa vào Danh sách bên dưới
            listHtml += `
              <div class="song-item">
                <span>🎵 ${songName}</span>
                <div>
                  <button class="btn-play" onclick="phatNhac('${songUrl}', '${songName}')">▶ Phát</button>
                  <button class="btn-danger" onclick="xoaBaiHat('${songId}')">🗑 Xóa</button>
                </div>
              </div>`;
          });
        }

        document.getElementById("songSelect").innerHTML = selectHtml;
        document.getElementById("songList").innerHTML = listHtml;
      }, (error) => {
        document.getElementById("songList").innerHTML = `<p style="color:red;">Lỗi tải máy chủ: ${error.message}</p>`;
      });
    }

    // 5. Chọn bài hát từ Menu Dropdown
    function chonVaPhatFromSelect() {
      const select = document.getElementById("songSelect");
      const url = select.value;
      const name = select.options[select.selectedIndex].text;
      if (url) {
        phatNhac(url, name);
      }
    }

    // 6. Hàm phát nhạc
    function phatNhac(url, name) {
      if (!url) return;
      const audio = document.getElementById("myAudio");
      audio.src = url;
      document.getElementById("currentPlaying").innerText = "Đang phát: " + name;
      audio.play().catch(e => alert("Không thể phát file audio này từ link web (lỗi CORS hoặc link hỏng)."));
    }

    // 7. Hàm xóa bài hát khỏi Firestore
    function xoaBaiHat(id) {
      if (confirm("Bạn có chắc chắn muốn xóa bài hát này khỏi danh sách?")) {
        db.collection("playlist").doc(id).delete();
      }
    }
  </script>
</body>
</html>
