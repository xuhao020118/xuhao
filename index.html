<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Khóa Bảo Mật Token & Trình Phát Nhạc MP3</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
    .box { background: #1e293b; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; }
    input, select, button { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; border-radius: 6px; border: none; font-size: 14px; }
    input { background: #334155; color: #fff; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-create { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; width: auto; padding: 5px 10px; }
    .btn-play { background: #38bdf8; color: #0f172a; width: auto; padding: 5px 10px; margin-right: 5px; }
    audio { width: 100%; margin-top: 10px; }
    .song-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; }
    .hidden { display: none; }
    .token-display { background: #0f172a; color: #38bdf8; padding: 10px; border-radius: 4px; font-family: monospace; word-break: break-all; margin-top: 10px; }
  </style>

  <!-- Firebase CDN (Dùng Firestore để lưu Token & Danh sách nhạc) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- 1. MÀN HÌNH BẢO MẬT & TẠO TOKEN -->
  <div id="lockScreen" class="box">
    <h2>🔑 KHÓA BẢO MẬT XUHAO</h2>
    
    <input type="text" id="tokenInput" placeholder="Nhập mã Token để vào hệ thống...">
    <button onclick="xacNhanToken()">🔑 Đăng Nhập Bằng Token</button>
    <button class="btn-create" onclick="taoTokenMoi()">✨ Tạo Mã Token Mới</button>

    <div id="tokenNotice" class="token-display hidden"></div>
    <p id="tokenStatus" style="color: #ef4444; margin-top: 5px; font-size: 13px;"></p>
  </div>

  <!-- 2. GIAO DIỆN QUẢN LÝ & PHÁT NHẠC (Chỉ hiện khi nhập Token đúng) -->
  <div id="mainApp" class="hidden">
    
    <!-- TRÌNH PHÁT NHẠC -->
    <div class="box">
      <h2>🎵 TRÌNH PHÁT NHẠC</h2>
      <p id="currentPlaying" style="color: #38bdf8; font-weight: bold;">Chưa chọn bài hát nào</p>
      <audio controls id="myAudio"></audio>
    </div>

    <!-- TRÌNH THÊM NHẠC (BẰNG LINK WEB MP3) -->
    <div class="box">
      <h3>➕ TRÌNH THÊM NHẠC MỚI</h3>
      <input type="text" id="newSongName" placeholder="Nhập tên bài hát...">
      <input type="text" id="newSongUrl" placeholder="Dán đường link MP3 công khai (https://...mp3)">
      <button onclick="themBaiHat()">Thêm Vào Máy Chủ Firebase</button>
    </div>

    <!-- TRÌNH CHỌN & TRÌNH XÓA NHẠC -->
    <div class="box">
      <h3>📜 TRÌNH CHỌN & XÓA NHẠC</h3>
      
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 2px;">--- TRÌNH CHỌN BÀI HÁT ---</p>
      <select id="songSelect" onchange="chonVaPhatFromSelect()">
        <option value="">-- Đang tải danh sách bài hát... --</option>
      </select>
      
      <p style="font-size: 13px; color: #94a3b8; margin-top: 15px; margin-bottom: 2px;">--- DANH SÁCH & TRÌNH XÓA NHẠC ---</p>
      <div id="songList">Đang kết nối máy chủ lấy danh sách nhạc...</div>
    </div>

  </div>

  <script>
    // Cấu hình Firebase
    const firebaseConfig = {
      measurementId: "G-KYSTJFD03T"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. TẠO MÃ TOKEN MỚI VÀ LƯU LÊN FIREBASE
    async function taoTokenMoi() {
      const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      const newToken = "XUHAO-" + randomCode;

      try {
        await db.collection("tokens").doc(newToken).set({
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        const notice = document.getElementById("tokenNotice");
        notice.innerHTML = `Mã Token mới của bạn: <b>${newToken}</b><br><small>(Hệ thống đã tự dán mã này vào ô bên trên để bạn mở khóa)</small>`;
        notice.classList.remove("hidden");
        document.getElementById("tokenInput").value = newToken;
      } catch (err) {
        alert("Lỗi khi tạo Token: " + err.message);
      }
    }

    // 2. XÁC NHẬN TOKEN TỪ FIREBASE ĐỂ VÀO HỆ THỐNG
    async function xacNhanToken() {
      const inputToken = document.getElementById("tokenInput").value.trim();
      const status = document.getElementById("tokenStatus");

      if (!inputToken) {
        status.innerText = "Vui lòng nhập hoặc bấm tạo mã Token!";
        return;
      }

      status.innerText = "Đang kiểm tra mã Token...";

      try {
        const doc = await db.collection("tokens").doc(inputToken).get();
        
        if (doc.exists || inputToken === "123456") {
          document.getElementById("lockScreen").classList.add("hidden");
          document.getElementById("mainApp").classList.remove("hidden");
          taiDanhSachNhac();
        } else {
          status.innerText = "Mã Token không tồn tại hoặc không chính xác!";
        }
      } catch (err) {
        status.innerText = "Lỗi xác thực: " + err.message;
      }
    }

    // 3. TRÌNH THÊM NHẠC BẰNG LINK MP3 CÔNG KHAI
    function themBaiHat() {
      const name = document.getElementById("newSongName").value.trim();
      const url = document.getElementById("newSongUrl").value.trim();

      if (!name || !url) {
        alert("Vui lòng nhập đủ Tên bài hát và Link MP3!");
        return;
      }

      db.collection("playlist").add({
        songName: name,
        songUrl: url,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("✅ Đã thêm bài hát vào danh sách thành công!");
        document.getElementById("newSongName").value = "";
        document.getElementById("newSongUrl").value = "";
      }).catch((err) => {
        alert("Lỗi thêm nhạc: " + err.message);
      });
    }

    // 4. TRÌNH CHỌN & ĐỒNG BỘ DANH SÁCH NHẠC
    function taiDanhSachNhac() {
      db.collection("playlist").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        let selectHtml = '<option value="">-- Bấm vào đây để chọn bài hát --</option>';
        let listHtml = '';

        if (snapshot.empty) {
          listHtml = '<p style="color:#94a3b8;">Chưa có bài hát nào trên máy chủ.</p>';
          selectHtml = '<option value="">Không có bài hát nào</option>';
        } else {
          snapshot.forEach((doc) => {
            const song = doc.data();
            const songId = doc.id;
            const songName = song.songName || "Bài hát không tên";
            const songUrl = song.songUrl || "";

            selectHtml += `<option value="${songUrl}">${songName}</option>`;

            listHtml += `
              <div class="song-item">
                <span>🎵 ${songName}</span>
                <div>
                  <button class="btn-play" onclick="phatNhac('${songUrl}', '${songName}')">▶ Phát</button>
                  <button class="btn-danger" onclick="xoaBaiHat('${songId}')">🗑 Xóa</button>
                </div>
              </div>`;
          });
        }

        document.getElementById("songSelect").innerHTML = selectHtml;
        document.getElementById("songList").innerHTML = listHtml;
      });
    }

    // 5. TRÌNH PHÁT NHẠC TỪ DROPDOWN CHỌN BÀI
    function chonVaPhatFromSelect() {
      const select = document.getElementById("songSelect");
      const url = select.value;
      const name = select.options[select.selectedIndex].text;
      if (url) phatNhac(url, name);
    }

    // 6. HÀM PHÁT NHẠC
    function phatNhac(url, name) {
      if (!url) return;
      const audio = document.getElementById("myAudio");
      audio.src = url;
      document.getElementById("currentPlaying").innerText = "Đang phát: " + name;
      audio.play().catch(() => alert("Không thể phát link MP3 này. Hãy kiểm tra lại đường link có công khai không!"));
    }

    // 7. TRÌNH XÓA NHẠC KHỎI MÁY CHỦ
    function xoaBaiHat(id) {
      if (confirm("Bạn có chắc chắn muốn xóa bài hát này khỏi danh sách?")) {
        db.collection("playlist").doc(id).delete();
      }
    }
  </script>
</body>
</html>
